name: 配置无法识别 / 下发失败
description: 反馈无法自动转换的配置，或下发到新设备时失败的命令
labels: ["适配请求"]
body:
  - type: markdown
    attributes:
      value: "感谢反馈！提交前请对配置中的 IP、密码、团体字等敏感信息进行脱敏。"
  - type: input
    id: old
    attributes:
      label: 旧交换机型号与软件版本
      placeholder: "例如 H3C S5560X-54C-EI, Comware 7.1.070 Release 6328P03"
    validations:
      required: true
  - type: input
    id: new
    attributes:
      label: 新交换机型号与软件版本
      placeholder: "例如 Ruijie S5750C-28GT4XS-H, RGOS 11.4(1)B74P2"
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: 未识别的配置片段 / 失败的命令及设备报错
      description: 可以从「④ 预览」页的提示区、或下发报告中复制
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望转换成的命令（如果知道）
      render: text
