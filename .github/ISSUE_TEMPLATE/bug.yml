name: Bug 反馈
description: 软件崩溃、界面异常、串口连接问题等
labels: ["bug"]
body:
  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: "例如 Windows 11 / macOS 15"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 软件版本 / 下载的安装包
      placeholder: "例如 v1.0.0 SwitchMigrator-Windows-exe.zip"
  - type: textarea
    id: steps
    attributes:
      label: 问题描述与复现步骤
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: 报错信息 / 串口终端输出
      description: 请粘贴界面日志或内置串口终端中的报错内容
      render: text
