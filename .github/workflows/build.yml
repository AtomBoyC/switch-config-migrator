name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要上传安装包的 Release 标签，如 v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: SwitchMigrator-Windows-exe.zip
          - os: macos-14
            asset: SwitchMigrator-macOS-arm64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m tests.test_e2e

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name SwitchMigrator main.py
          Compress-Archive -Path dist/SwitchMigrator.exe -DestinationPath ${{ matrix.asset }}

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m PyInstaller --noconfirm --windowed --name SwitchMigrator --osx-bundle-identifier io.github.atomboyc.switchmigrator main.py
          ditto -c -k --keepParent dist/SwitchMigrator.app ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

      - name: Upload to Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          for i in 1 2 3 4 5 6; do
            gh release view "$TAG" >/dev/null 2>&1 && break
            echo "等待 Release $TAG 创建..."; sleep 20
          done
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "自动构建"
          gh release upload "$TAG" "${{ matrix.asset }}" --clobber
