name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: End-to-end test with simulated switches
        run: python -m tests.test_e2e
      - name: Offline conversion samples
        run: |
          for to in h3c huawei ruijie cisco; do
            python main.py --cli samples/h3c_s5560_sample.cfg --to $to -o /dev/null
            python main.py --cli samples/huawei_s5720_sample.cfg --to $to -o /dev/null
          done
