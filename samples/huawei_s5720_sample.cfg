#
!Software Version V200R019C10SPC500
 sysname HW-Agg-Lib
#
vlan batch 10 20 100 to 102
#
stp mode rstp
stp instance 0 priority 8192
#
dhcp enable
#
vlan 10
 description Library-WiFi
#
interface Vlanif10
 ip address 10.8.10.1 255.255.254.0
 dhcp select relay
 dhcp relay server-ip 10.0.0.10
#
interface Vlanif100
 ip address 172.16.8.2 255.255.255.0
 vrrp vrid 1 virtual-ip 172.16.8.1
 vrrp vrid 1 priority 110
 vrrp vrid 1 preempt-mode timer delay 10
#
interface Eth-Trunk1
 description To-Core
 port link-type trunk
 undo port trunk allow-pass vlan 1
 port trunk allow-pass vlan 10 20 100 to 102
 mode lacp
#
interface GigabitEthernet0/0/1
 description AP-1F
 port link-type access
 port default vlan 10
 stp edged-port enable
#
interface GigabitEthernet0/0/2
 port link-type hybrid
 port hybrid pvid vlan 20
 port hybrid untagged vlan 20
#
interface XGigabitEthernet0/0/1
 eth-trunk 1
#
interface XGigabitEthernet0/0/2
 eth-trunk 1
#
interface NULL0
#
 snmp-agent
 snmp-agent community read cipher %^%#abc%^%#
 snmp-agent sys-info version v2c
#
ip route-static 0.0.0.0 0.0.0.0 172.16.8.254
#
user-interface con 0
 authentication-mode password
user-interface vty 0 4
 authentication-mode aaa
#
return
